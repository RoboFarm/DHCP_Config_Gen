name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  # Lets the workflow be started by hand from the Actions tab. Useful when a
  # workflow has never run -- enabling Actions on a repo does not retroactively
  # trigger anything, so without this the only way to see a first result is to
  # push another commit.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Run the test suite
        run: python3 tests/run_tests.py

      - name: Build the .deb
        run: bash packaging/debian/build-deb.sh

      - name: Check the built package installs cleanly
        run: |
          sudo apt-get install -y ./dist/oran-dhcp-gen_*_all.deb
          oran-dhcp-gen --version
          oran-dhcp-gen /usr/share/oran-dhcp-gen/oran_dhcp.yaml.example \
              --target all --outdir /tmp/ci-out/
