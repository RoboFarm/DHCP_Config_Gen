# dhcpd.conf  (CORRECTED)
# Fix applied 2026-07-10: CA/RA subject DN in option 43 sub-option 5 extended to
# include the trailing "/C=US" so the wire bytes match the comment and the real
# CA certificate subject. Length 0x40 (64) -> 0x45 (69); appended 2f:43:3d:55:53.
# Confirm against: openssl x509 -in /opt/cert/1FinityLabRootCA.pem -noout -subject
#
# Original captured version is in ../references/dhcpd.conf.

default-lease-time 43200;
max-lease-time 86400;

# Define custom options for O-RAN
option vendor-class-identifier code 60 = string;
option interface-mtu code 26 = unsigned integer 16;

# Option 43 for O-RAN TLV: sub-option 0x81 (Controller IP), 0x86 (TLS)
#set oru-tls = "81:04:c0:a8:38:0c:86:01:01";  # To enable netconf over TLS
#set oru-ssh = "81:04:c0:a8:38:0c";  # To enable netconf over SSH

# Log vendor-class-identifier for all clients
log(info, concat("Vendor Class String: ", option vendor-class-identifier));

class "TDDn77" {
    match if substring(option vendor-class-identifier, 0, 18) = "o-ran-ru2/FJ/44R14";
    log (info, "Matched TDDn77 class");
    log (info, concat("Sending controller IP: ", binary-to-ascii(16, 8, ":", option vendor-encapsulated-options)));
    
    # Combined into a single continuous token line
    option vendor-encapsulated-options 01:04:C0:A8:38:0C:03:02:1F:91:04:06:2F:70:6B:69:78:2F:05:45:2f:43:4e:3d:31:46:69:6e:69:74:79:4c:61:62:20:52:6f:6f:74:20:43:41:2f:4f:55:3d:57:56:20:4c:61:62:2f:4f:3d:31:46:69:6e:69:74:79:2f:4c:3d:52:69:63:68:61:72:64:73:6f:6e:2f:53:54:3d:54:65:78:61:73:2f:43:3d:55:53:06:04:68:74:74:70:81:04:C0:A8:38:0C:86:01:01;

    # option 01 : 192.168.56.12
    # option 03 : 8081
    # option 04 : /pkix/
    # option 05 : /CN=1FinityLab Root CA/OU=WV Lab/O=1Finity/L=Richardson/ST=Texas/C=US
    # option 06 : http
    # option 81 : 192.168.56.12
    # option 86 : 01
}

class "FDDn25n66" {
    match if substring(option vendor-class-identifier, 0, 18) = "o-ran-ru2/FJ/44R26";
    log (info, "Matched FDDn25n66 class");
    log (info, concat("Sending controller IP: ", binary-to-ascii(16, 8, ":", option vendor-encapsulated-options)));
    
    # Combined into a single continuous token line
    option vendor-encapsulated-options 01:04:C0:A8:38:0C:03:02:1F:93:04:06:2F:70:6B:69:78:2F:05:45:2f:43:4e:3d:31:46:69:6e:69:74:79:4c:61:62:20:52:6f:6f:74:20:43:41:2f:4f:55:3d:57:56:20:4c:61:62:2f:4f:3d:31:46:69:6e:69:74:79:2f:4c:3d:52:69:63:68:61:72:64:73:6f:6e:2f:53:54:3d:54:65:78:61:73:2f:43:3d:55:53:06:04:68:74:74:70:81:04:C0:A8:38:0C:86:01:01;

    # option 01 : 192.168.56.12
    # option 03 : 8083
    # option 04 : /pkix/
    # option 05 : /CN=1FinityLab Root CA/OU=WV Lab/O=1Finity/L=Richardson/ST=Texas/C=US
    # option 06 : http
    # option 81 : 192.168.56.12
    # option 86 : 01
}

class "Unmatched" {
    match if substring(option vendor-class-identifier, 0, 0) = "";
    log (info, "Matched Unmatched class");
    log (info, concat("Unmatched Vendor Class String: ", option vendor-class-identifier));
    option vendor-encapsulated-options 81:04:c0:a8:38:0c; 
    option interface-mtu 1440;  # Set MTU to 1440
}

subnet 192.168.56.0 netmask 255.255.255.0 {
    authoritative;
    option routers 192.168.56.1;

    pool {
        allow members of "TDDn77";
        range 192.168.56.100 192.168.56.119;
    }

    pool {
        allow members of "FDDn25n66";
        range 192.168.56.130 192.168.56.159;
    }

    # Fallback pool for unmatched clients
    pool {
        allow members of "Unmatched";
        range 192.168.56.180 192.168.56.189;
    }
}