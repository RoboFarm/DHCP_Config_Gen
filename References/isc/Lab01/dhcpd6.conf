# dhcpd6.conf  (CORRECTED)
# Fix applied 2026-07-10: CA/RA subject DN in option 17 sub-option 5 extended to
# include the trailing "/C=US" so the wire bytes match the comment and the real
# CA certificate subject. Length 00:40 (64) -> 00:45 (69); appended 2f:43:3d:55:53.
# Confirm against: openssl x509 -in /opt/cert/1FinityLabRootCA.pem -noout -subject
#
# Original captured version is in ../references/dhcpd6.conf.

# Default lease time
default-lease-time 43200;
max-lease-time 86400;

# Enable dhcpv6 server
authoritative;

# Define custom options for O-RAN
option dhcp6.vendor-class code 16 = string;
option dhcp6.vendor-opts code 17 = { integer 32, string };


# Log dhcp6.vendor-class for all clients
log(info, concat("Vendor Class (hex): ", binary-to-ascii(16, 8, ":", option dhcp6.vendor-class)));
log(info, concat("Vendor Class String: ", substring(option dhcp6.vendor-class, 6, 33)));

# Option 17 for O-RAN TLV in IPv6
#set oru-tls-v6 = "00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:38:00:0C:00:86:00:01:01";  # To enable netconf over TLS
#set oru-ssh-v6 = "00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:38:00:0C";  # To enable netconf over SSH

class "TDDn77" {
    match if substring(option dhcp6.vendor-class, 6, 18) = "o-ran-ru2/FJ/44R14";
    log (info, "Matched TDDn77 class");
    option dhcp6.vendor-opts 53148 00:01:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:38:00:0C
    :00:03:00:02:1F:90
    :00:04:00:06:2F:70:6B:69:78:2F
    :00:05:00:45:2f:43:4e:3d:31:46:69:6e:69:74:79:4c:61:62:20:52:6f:6f:74:20:43:41:2f:4f:55:3d:57:56:20:4c:61:62:2f:4f:3d:31:46:69:6e:69:74:79:2f:4c:3d:52:69:63:68:61:72:64:73:6f:6e:2f:53:54:3d:54:65:78:61:73:2f:43:3d:55:53
    :00:06:00:04:68:74:74:70
    :00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:38:00:0C
    :00:86:00:01:01;	#Over TLS
    # :00:86:00:01:00;	#Over SSH

    # option 01 : fd00:8b36:f2a9::38:0c
    # option 03 : 8080
    # option 04 : /pkix/
    # option 05 : /CN=1FinityLab Root CA/OU=WV Lab/O=1Finity/L=Richardson/ST=Texas/C=US
    # option 06 : http
    # option 81 : fd00:8b36:f2a9::38:0c
    # option 86 : 01
}

class "FDDn25n66" {
    match if substring(option dhcp6.vendor-class, 6, 18) = "o-ran-ru2/FJ/44R26";
    log (info, "Matched FDDn25n66 class");
    #option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:38:00:0C;  # Controller IPv6 fd00:8b36:f2a9::38:0c
    option dhcp6.vendor-opts 53148 00:01:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:38:00:0C
    :00:03:00:02:1F:92
    :00:04:00:06:2F:70:6B:69:78:2F
    :00:05:00:45:2f:43:4e:3d:31:46:69:6e:69:74:79:4c:61:62:20:52:6f:6f:74:20:43:41:2f:4f:55:3d:57:56:20:4c:61:62:2f:4f:3d:31:46:69:6e:69:74:79:2f:4c:3d:52:69:63:68:61:72:64:73:6f:6e:2f:53:54:3d:54:65:78:61:73:2f:43:3d:55:53
    :00:06:00:04:68:74:74:70
    :00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:38:00:0C
    :00:86:00:01:01;	#Over TLS
    #:00:86:00:01:00;	#Over SSH

    # option 01 : fd00:8b36:f2a9::38:0c
    # option 03 : 8082
    # option 04 : /pkix/
    # option 05 : /CN=1FinityLab Root CA/OU=WV Lab/O=1Finity/L=Richardson/ST=Texas/C=US
    # option 06 : http
    # option 81 : fd00:8b36:f2a9::38:0c
    # option 86 : 01
}

class "Unmatched" {
    match if substring(option dhcp6.vendor-class, 0, 0) = "";
    log (info, "Matched Unmatched class");
    log (info, concat("Unmatched Vendor Class String: ", substring(option dhcp6.vendor-class, 6, 33)));
    option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:38:00:0C; 
} # Controller IPv6 fd00:8b36:f2a9::38:0c + TLS

# IPv6 subnet configuration
subnet6 fd00:8b36:f2a9::/64 {
    # DNS server
    option dhcp6.name-servers fd00:8b36:f2a9::1;

    # Pool for TDDn77
    pool6 {
        allow members of "TDDn77";
        range6 fd00:8b36:f2a9::160 fd00:8b36:f2a9::169;
    }

    # Pool for FDDn25n66
    pool6 {
        allow members of "FDDn25n66";
        range6 fd00:8b36:f2a9::170 fd00:8b36:f2a9::179;
    }

    # Fallback pool for unmatched clients
    pool6 {
        allow members of "Unmatched";
        range6 fd00:8b36:f2a9::180 fd00:8b36:f2a9::199;
    }
}
