# dhcpd.conf
# Sample configuration file for ISC dhcpd

default-lease-time 43200;
max-lease-time 86400;

# Define custom options for O-RAN
option vendor-class-identifier code 60 = string;
option interface-mtu code 26 = unsigned integer 16;

# Option 43 for O-RAN TLV: sub-option 0x81 (Controller IP), 0x86 (TLS)
#set oru-tls = "81:04:c0:a8:24:dc:86:01:01";  # To enable netconf over TLS
#set oru-ssh = "81:04:c0:a8:24:dc";  # To enable netconf over SSH

# Log vendor-class-identifier for all clients
log(info, concat("Vendor Class String: ", option vendor-class-identifier));

class "Gen1TB" {
    match if substring(option vendor-class-identifier, 0, 21) = "o-ran-ru2/FJ/N712926R";
    log (info, "Matched Gen1TB class");
    option vendor-encapsulated-options 81:04:c0:a8:24:dc; #:86:01:01;  # Controller IP 192.168.36.220 + TLS
    option interface-mtu 1440;  # Set MTU to 1440
}

class "Gen1DB" {
    match if substring(option vendor-class-identifier, 0, 21) = "o-ran-ru2/FJ/N706600R";
    log (info, "Matched Gen1DB class");
    option vendor-encapsulated-options 81:04:c0:a8:24:dc; #:86:01:01;  # Controller IP 192.168.36.220 + TLS
}

class "Gen2TB" {
    match if substring(option vendor-class-identifier, 0, 21) = "o-ran-ru2/FJ/N712926S";
    log (info, "Matched Gen2TB class");
    option vendor-encapsulated-options 81:04:c0:a8:24:dc; #:86:01:01;  # Controller IP 192.168.36.220 + TLS
}

class "Gen2DB" {
    match if substring(option vendor-class-identifier, 0, 21) = "o-ran-ru2/FJ/N706600S";
    log (info, "Matched Gen2DB class");
    option vendor-encapsulated-options 81:04:c0:a8:24:dc; #:86:01:01;  # Controller IP 192.168.36.220 + TLS
}

class "TB2" {
    match if substring(option vendor-class-identifier, 0, 21) = "o-ran-ru2/FJ/N717066M";
    log (info, "Matched TB2 class");
    option vendor-encapsulated-options 81:04:c0:a8:24:dc; #:86:01:01;  # Controller IP 192.168.36.220 + TLS
}

class "n77" {
    match if substring(option vendor-class-identifier, 0, 19) = "o-ran-ru2/FJ/N70660";
    log (info, "Matched n77 class");
    option vendor-encapsulated-options 81:04:c0:a8:24:dc; #:86:01:01;  # Controller IP 192.168.36.220 + TLS
}

class "ATTn77" {
    match if substring(option vendor-class-identifier, 0, 18) = "o-ran-ru2/FJ/44R14";
    log (info, "Matched ATTn77 class");
    log (info, concat("Sending controller IP: ", binary-to-ascii(16, 8, ":", option vendor-encapsulated-options)));
    #SSL-----
    #option vendor-encapsulated-options 81:04:c0:a8:24:dc:86:01:00:87:02:10:ee;
    #TLS-----
    option vendor-encapsulated-options 01:04:C0:A8:24:EB
    :03:02:1F:90
    :04:1b:2f:65:6a:62:63:61:2f:70:75:62:6c:69:63:77:65:62:2f:63:6d:70:2f:41:54:54:5f:52:55
    :05:45:2f:43:4e:3d:31:46:69:6e:69:74:79:4c:61:62:20:52:6f:6f:74:20:43:41:2f:4f:55:3d:57:56:20:4c:61:62:2f:4f:3d:31:46:69:6e:69:74:79:2f:4c:3d:52:69:63:68:61:72:64:73:6f:6e:2f:53:54:3d:54:65:78:61:73:2f:43:3d:55:53
    :06:04:68:74:74:70
    :81:04:C0:A8:24:DC
    :86:01:01;
}

class "ATTn25n66" {
    match if substring(option vendor-class-identifier, 0, 18) = "o-ran-ru2/FJ/44R26";
    log (info, "Matched ATTn25n66 class");
    log (info, concat("Sending controller IP: ", binary-to-ascii(16, 8, ":", option vendor-encapsulated-options)));
    #SSL-----
    #option vendor-encapsulated-options 81:04:c0:a8:24:dc:86:01:00:87:02:10:ee;
    #TLS-----
    option vendor-encapsulated-options 01:04:C0:A8:24:EB
    :03:02:1F:90
    :04:1b:2f:65:6a:62:63:61:2f:70:75:62:6c:69:63:77:65:62:2f:63:6d:70:2f:41:54:54:5f:52:55
    :05:45:2f:43:4e:3d:31:46:69:6e:69:74:79:4c:61:62:20:52:6f:6f:74:20:43:41:2f:4f:55:3d:57:56:20:4c:61:62:2f:4f:3d:31:46:69:6e:69:74:79:2f:4c:3d:52:69:63:68:61:72:64:73:6f:6e:2f:53:54:3d:54:65:78:61:73:2f:43:3d:55:53
    :06:04:68:74:74:70
    :81:04:C0:A8:24:DC
    :86:01:01;
}

class "Unmatched" {
    match if substring(option vendor-class-identifier, 0, 0) = "";
    log (info, "Matched Unmatched class");
    log (info, concat("Unmatched Vendor Class String: ", option vendor-class-identifier));
    option vendor-encapsulated-options 81:04:c0:a8:24:dc; #:86:01:01;  # Controller IP 192.168.36.220 + TLS
    option interface-mtu 1440;  # Set MTU to 1440
}

subnet 192.168.36.0 netmask 255.255.255.0 {
    authoritative;
    option routers 192.168.36.1;
    option domain-name-servers 192.168.36.20;

    pool {
        allow members of "Gen1DB";
        range 192.168.36.100 192.168.36.109;
    }

    pool {
        allow members of "Gen1TB";
        range 192.168.36.110 192.168.36.119;
        option interface-mtu 1440;
    }

    pool {
        allow members of "Gen2DB";
        range 192.168.36.120 192.168.36.129;
    }

    pool {
        allow members of "Gen2TB";
        range 192.168.36.130 192.168.36.139;
    }

    pool {
        allow members of "TB2";
        range 192.168.36.140 192.168.36.149;
    }

    pool {
        allow members of "n77";
        range 192.168.36.150 192.168.36.159;
    }

    pool {
        allow members of "ATTn77";
        range 192.168.36.160 192.168.36.169;
    }

    pool {
        allow members of "ATTn25n66";
        range 192.168.36.170 192.168.36.179;
    }


    # Fallback pool for unmatched clients
    pool {
        allow members of "Unmatched";
        range 192.168.36.180 192.168.36.189;
    }
}
