class "Unmatched" { 
    match if substring(option dhcp6.vendor-class, 0, 0) = ""; 
    log (info, "Matched Unmatched class"); 
    log (info, concat("Unmatched Vendor Class String: ", substring(option dhcp6.vendor-class, 6, 33)));
    option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC; # Controller IPv6 fd00:8b36:f2a9::24:dc + TLS }
}

# IPv6 subnet configuration
subnet6 fd00:8b36:f2a9::/64 {
    # DNS server
    option dhcp6.name-servers fd00:8b36:f2a9::24:14;

    # Pool for Gen1DB
    pool6 {
        allow members of "Gen1DB";
        range6 fd00:8b36:f2a9::100 fd00:8b36:f2a9::109;
    }

    # Pool for Gen1TB
    pool6 {
        allow members of "Gen1TB";
        range6 fd00:8b36:f2a9::110 fd00:8b36:f2a9::119;
    }

    # Pool for Gen2DB
    pool6 {
        allow members of "Gen2DB";
        range6 fd00:8b36:f2a9::120 fd00:8b36:f2a9::129;
    }

    # Pool for Gen2TB
    pool6 {
        allow members of "Gen2TB";
        range6 fd00:8b36:f2a9::130 fd00:8b36:f2a9::139;
    }

    # Pool for TB2
    pool6 {
        allow members of "TB2";
        range6 fd00:8b36:f2a9::140 fd00:8b36:f2a9::149;
    }

    # Pool for n77
    pool6 {
        allow members of "n77";
        range6 fd00:8b36:f2a9::150 fd00:8b36:f2a9::159;
    }

    # Pool for ATTn77
    pool6 {
        allow members of "ATTn77";
        range6 fd00:8b36:f2a9::160 fd00:8b36:f2a9::169;
    }

    # Pool for ATTn25n66
    pool6 {
        allow members of "ATTn25n66-DC";
        allow members of "ATTn25n66-AC";
        range6 fd00:8b36:f2a9::170 fd00:8b36:f2a9::179;
    }


    # Fallback pool for DT radio clients
    pool6 {
        allow members of "DTTB3";
        range6 fd00:8b36:f2a9::180 fd00:8b36:f2a9::199;
    }
    
    # Fallback pool for unmatched clients
    pool6 {
        allow members of "Unmatched";
        range6 fd00:8b36:f2a9::200 fd00:8b36:f2a9::209;
    }
}
