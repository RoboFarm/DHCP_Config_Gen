# dhcpd6.conf
# Sample configuration file for ISC dhcpd for IPv6

# Default lease time
default-lease-time 43200;
max-lease-time 86400;

# Enable dhcpv6 server
authoritative;

# Define custom options for O-RAN
option dhcp6.vendor-class code 16 = string;
option dhcp6.vendor-opts code 17 = { integer 32, string };


# Log dhcp6.vendor-class for all clients
log(info, concat("Vendor Class (hex): ", binary-to-ascii(16, 8, ":", option dhcp6.vendor-class)));
log(info, concat("Vendor Class String: ", substring(option dhcp6.vendor-class, 6, 33)));

# Option 17 for O-RAN TLV in IPv6
#set oru-tls-v6 = "00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC:00:86:00:01:01";  # To enable netconf over TLS
#set oru-ssh-v6 = "00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC";  # To enable netconf over SSH

class "Gen1TB" {
    match if substring(option dhcp6.vendor-class, 6, 21) = "o-ran-ru2/FJ/N712926R";
    option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC;  # Controller IPv6 fd00:8b36:f2a9::24:dc
}

class "Gen1DB" {
    match if substring(option dhcp6.vendor-class, 6, 21) = "o-ran-ru2/FJ/N706600R";
    option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC;  # Controller IPv6 fd00:8b36:f2a9::24:dc
}

class "Gen2TB" {
    match if substring(option dhcp6.vendor-class, 6, 21) = "o-ran-ru2/FJ/N712926S";
    option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC;  # Controller IPv6 fd00:8b36:f2a9::24:dc
}

class "Gen2DB" {
    match if substring(option dhcp6.vendor-class, 6, 21) = "o-ran-ru2/FJ/N706600S";
    option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC;  # Controller IPv6 fd00:8b36:f2:a9::24:dc
}

class "TB2" {
    match if substring(option dhcp6.vendor-class, 6, 21) = "o-ran-ru2/FJ/N717066M";
    log (info, concat("TB2 Substring: ", substring(option dhcp6.vendor-class, 4, 21)));

    option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC;  # Controller IPv6 fd00:8b36:f2a9::24:dc
}

class "n77" {
    match if substring(option dhcp6.vendor-class, 6, 19) = "o-ran-ru2/FJ/N70660";
    option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC;  # Controller IPv6 fd00:8b36:f2a9::24:dc
