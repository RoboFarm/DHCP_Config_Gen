    max-lease-time 150;
    preferred-lifetime 140;
    option dhcp-renewal-time 60;
    option dhcp-rebinding-time 120;
    #SSL-----------------------
    #option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC;
    #TLS-----------------------
    option dhcp6.vendor-opts 53148 00:01:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:eb
    :00:03:00:02:1f:90
