    :00:06:00:04:68:74:74:70
    :00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC
    :00:86:00:01:01;
    #TEST----------------------
    #option dhcp6.vendor-opts 53148 00:01:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:f0
    #:00:03:00:02:1f:90
    #:00:04:00:06:2F:70:6B:69:78:2F
    #:00:05:00:1b:2f:43:4e:3d:41:54:54:2d:53:53:4c:32:2f:4f:3d:31:46:69:6e:69:74:79:2f:43:3d:55:53
    #:00:06:00:04:68:74:74:70
    #:00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC
    #:00:86:00:01:01;
    # CA server IPv6 fd00:8b36:f2a9::24:eb
