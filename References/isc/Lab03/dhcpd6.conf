    # /ejbca/publicweb/cmp/ATT_RU
    # /CN=1FinityLab Root CA/OU=WV Lab/O=1Finity/L=Richardson/ST=Texas/C=US
    # http
    # Controller IPv6 fd00:8b36:f2a9::24:dc
