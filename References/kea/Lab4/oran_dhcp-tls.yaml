# oran_dhcp.yaml — Lab4 with NETCONF call-home over TLS enabled
#
# ===========================================================================
# Where these values came from, so nobody has to guess later:
#
# Every value below is confirmed against what Lab04 actually put on the wire
# on 2026-08-25 — a tcpdump of the DHCP Offer to a 44R14 was decoded and
# compared to this model sub-option by sub-option, and they match.
#
# It took two corrections to get there, both in values that had been
# recovered from the commented-out `tls_ca:` block oran_dhcp.yaml used to
# carry. That whole block turned out to be stale:
#
#   ca_server_ipv4/ipv6   ::95:240  ->  the controller host itself
#   port                  8091      ->  8080
#   subject_dn            /OU=SPM/O=1Finity/C=US/CN=ATT-SSL/...
#                                   ->  /CN=1FinityLab Root CA/...
#
# uri_path (/pkix/) and app_protocol (http) came from the same block and
# turned out to be right: a plain-HTTP GET to
# http://[fd00:8b36:f2a9::2c:6]:8080/pkix/ is answered by the CMP responder
# itself with "405 CMP requires POST", which only that path and that scheme
# produce.
#
# On subject_dn, which had been the open question here: it is now settled by
# a counter-example, not by inspecting a certificate.
#
# The srsllsc1 stack in this same lab advertises this exact 69-byte string —
# /CN=1FinityLab Root CA/OU=WV Lab/O=1Finity/L=Richardson/ST=Texas/C=US — from
# a DHCP server this tool did not generate, and a 44R14-N77a enrolled against
# it over CMPv2 in under ten seconds and reached TLS call-home. So a DN that
# does not match the CA certificate's own subject is NOT what makes an O-RU
# loop on enrolment; this string is what a working deployment sends. See
# References/srsllsc1/ for the capture and the test that pins it.
#
# What still differs between there and here is the CA host itself: srsllsc1
# points 0x01/0x81 at fd00:8b36:f2a9::38:c, this model at ::2c:6. Same port,
# same path, same protocol, same DN. If an O-RU loops against ::2c:6 while
# the identical chain works against ::38:c, the fault is in that responder,
# not in the DHCP payload.
#
# To see exactly what an O-RU will be sent, without writing anything:
#     oran-dhcp-gen oran_dhcp-tls.yaml --explain
# ===========================================================================
#
# This file is oran_dhcp.yaml with TLS turned on. It is kept separate rather
# than replacing it because oran_dhcp.yaml records what the lab runs today
# (SSH), and is a regression-test input.
#
# Switching back to SSH is the one `protocol:` line in `defaults:` below.

global:
  default_lease_time: 43200      # 12 hours
  max_lease_time:     86400      # 24 hours
  oran_enterprise_id: 53148      # O-RAN Alliance IANA — do not change

controllers:
  - name: ctrl_primary
    description: "Primary O-RU controller"
    ipv4: "192.168.44.6"
    ipv6: "fd00:8b36:f2a9::2c:6"

  - name: ctrl_att
    description: "ATT-specific controller (same node as ctrl_primary today)"
    ipv4: "192.168.44.6"
    ipv6: "fd00:8b36:f2a9::2c:6"

# ---------------------------------------------------------------------------
# CA/RA profile — the PKI endpoint an O-RU enrols against before it can
# complete a TLS call-home. Values recovered from the `tls_ca:` block that
# oran_dhcp.yaml carried commented out; see the header for the one exception.
# ---------------------------------------------------------------------------
ca_ra_profiles:
  att_spm:
    description: "ATT/1Finity SPM CA — runs on the controller host"
    ca_server_ipv4: "192.168.44.6"             # sub-opt 0x01, IPv4 output
    ca_server_ipv6: "fd00:8b36:f2a9::2c:6"     # sub-opt 0x01, IPv6 output
    uri_path:       "/pkix/"                                   # sub-opt 0x04
    subject_dn:     "/CN=1FinityLab Root CA/OU=WV Lab/O=1Finity/L=Richardson/ST=Texas/C=US"  # 0x05
    app_protocol:   "http"                                     # sub-opt 0x06

# ---------------------------------------------------------------------------
# Lab-wide defaults. Every class inherits these unless it says otherwise, so
# turning TLS off again is the single `protocol:` line here.
# ---------------------------------------------------------------------------
defaults:
  controller: ctrl_att
  protocol: tls
  callhome_port: auto            # -> 4335 (sub-opt 0x87). Without this the
                                 # O-RU uses its firmware default of 4334,
                                 # the SSH port, and TLS never completes.
  ca_ra:
    profile: att_spm
    port: 8080                   # CA/RA port (sub-opt 0x03), confirmed
                                 # on the wire

oru_classes:

  - name: ATTn77
    description: "ATT n77 band RU (44R14 series)"
    match_prefix: "o-ran-ru2/FJ/44R14"
    ipv4_range: "192.168.44.160-169"
    ipv6_range: "fd00:8b36:f2a9::160-169"

  - name: ATTn25n66
    description: "ATT n25/n66 band RU (44R26 series)"
    match_prefix: "o-ran-ru2/FJ/44R26"
    ipv4_range: "192.168.44.170-179"
    ipv6_range: "fd00:8b36:f2a9::170-179"

  # Catch-all — keep last. Stays on SSH: an unrecognised O-RU has no business
  # being pointed at the CA. Overriding protocol here is all it takes, and the
  # ca_ra block is not inherited into an ssh class.
  - name: Unmatched
    description: "Fallback for unrecognised vendor class"
    match_prefix: ""
    controller: ctrl_primary
    protocol: ssh
    callhome_port:                 # explicitly none — an unrecognised O-RU
                                   # gets the bare controller IP and nothing
                                   # else, exactly as it does today
    ipv4_range: "192.168.44.180-189"
    ipv6_range: "fd00:8b36:f2a9::180-199"
    options:
      interface_mtu: 1440

subnets:
  ipv4:
    - subnet: "192.168.44.0/24"
      gateway: "192.168.44.1"
      dns_servers:
        - "192.168.44.1"
      interface: "br-mplane"

  ipv6:
    - subnet: "fd00:8b36:f2a9::/64"
      dns_servers:
        - "fd00:8b36:f2a9::1"
      interface: "br-mplane"
