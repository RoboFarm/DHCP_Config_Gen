# oran_dhcp.yaml
# Generic O-RAN DHCP deployment data model
# Version: 0.2.0
#
# This file is the single source of truth for DHCP configuration.
# A config generator reads this and produces server-specific configs
# for ISC DHCP, Kea, dnsmasq, etc.
#
# Changelog:
# 0.1.0 - Initial draft
# 0.2.0 - match_length auto-derived from match_prefix (removed from model)
#          Simplified IP range notation: "x.x.x.100-109" / "::100-109"
#          Moved protocol (ssh/tls) to per-class level

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
global:
  default_lease_time: 43200      # 12 hours (seconds)
  max_lease_time: 86400          # 24 hours (seconds)
  oran_enterprise_id: 53148      # O-RAN Alliance IANA enterprise number

# ---------------------------------------------------------------------------
# Controllers
# Defines O-RU controllers signalled via DHCP options.
# protocol is NOT set here - it is set per O-RU class below.
# ---------------------------------------------------------------------------
controllers:
  - name: ctrl_primary
    description: "Primary O-RU controller"
    ipv4: "192.168.44.6"
    ipv6: "fd00:8b36:f2a9::2c:6"

  - name: ctrl_att
    description: "ATT-specific controller"
    ipv4: "192.168.44.6"
    ipv6: "fd00:8b36:f2a9::2c:6"
    # NOTE: a 'tls_ca:' block used to be sketched here. It was never a real
    # field — the generator ignored it, so uncommenting it produced an SSH
    # payload with no CA/RA sub-options and no warning. It is now a hard
    # error. TLS CA/RA bootstrap is configured with the top-level
    # 'ca_ra_profiles' section and a per-class 'ca_ra:' block; see the bottom
    # of this file for the recipe.

# ---------------------------------------------------------------------------
# O-RU classes
#
# match_prefix  : vendor-class-identifier prefix string to match
#                 match_length is auto-derived as len(match_prefix)
#                 use "" for the catch-all Unmatched class
#
# controller    : references a controller name defined above
#
# protocol      : ssh or tls (per-class)
#                 ssh  -> option 43 TLV: 0x81 (controller IP only)
#                 tls  -> option 43 TLV: 0x81 (controller IP) + 0x86 0x01 0x01
#
# callhome_port : optional NETCONF call-home port -> sub-option 0x87
#                 an integer, or 'auto' (SSH 4334, TLS 4335). Omitted here,
#                 so no 0x87 is sent and each O-RU uses its firmware default
#                 — which on the Fujitsu units is 4334, the SSH port. Set it
#                 when switching a class to TLS.
#
# ipv4_range    : "A.B.C.start-end"  e.g. "192.168.36.100-109"
# ipv6_range    : "prefix::start-end" e.g. "fd00:8b36:f2a9::100-109"
#
# options       : optional per-class DHCP option overrides
# ---------------------------------------------------------------------------
oru_classes:

  - name: ATTn77
    description: "ATT n77 band RU (44R14 series)"
    match_prefix: "o-ran-ru2/FJ/44R14"
    controller: ctrl_att
    protocol: ssh                          # change to tls to enable NETCONF over TLS
    ipv4_range: "192.168.44.160-169"
    ipv6_range: "fd00:8b36:f2a9::160-169"

  - name: ATTn25n66
    description: "ATT n25/n66 band RU (44R26 series)"
    match_prefix: "o-ran-ru2/FJ/44R26"
    controller: ctrl_att
    protocol: ssh
    ipv4_range: "192.168.44.170-179"
    ipv6_range: "fd00:8b36:f2a9::170-179"

  # Catch-all — always keep this last
  - name: Unmatched
    description: "Fallback for unrecognised vendor class"
    match_prefix: ""
    controller: ctrl_primary
    protocol: ssh
    ipv4_range: "192.168.44.180-189"
    ipv6_range: "fd00:8b36:f2a9::180-199"
    options:
      interface_mtu: 1440

# ---------------------------------------------------------------------------
# Subnets
# ---------------------------------------------------------------------------
subnets:
  ipv4:
    - subnet: "192.168.44.0/24"
      gateway: "192.168.44.1"
      dns_servers:
        - "192.168.44.1"
      interface: "br-mplane"

  ipv6:
    - subnet: "fd00:8b36:f2a9::/64"
      dns_servers:
        - "fd00:8b36:f2a9::1"
      interface: "br-mplane"

# ---------------------------------------------------------------------------
# Turning on NETCONF call-home over TLS
#
# TLS call-home needs the O-RU to enrol a certificate first (sub-options
# 0x01/0x03/0x04/0x05/0x06 point it at the CA/RA), then call home on the TLS
# port (0x86 = 01 and 0x87 = 4335). Two edits:
#
#   1. Describe the CA/RA server once:
#
#        ca_ra_profiles:
#          att_common:
#            ca_server_ipv4: "192.168.44.235"   # sub-opt 0x01, IPv4 output
#            ca_server_ipv6: "fd00:8b36:f2a9::2c:eb"  # sub-opt 0x01, IPv6 output
#            uri_path:       "/ejbca/publicweb/cmp/ATT_RU"       # sub-opt 0x04
#            subject_dn:     "/CN=1FinityLab Root CA/OU=WV Lab/O=1Finity"  # 0x05
#            app_protocol:   "http"                               # sub-opt 0x06
#
#   2. Turn it on for every class at once with a defaults block:
#
#        defaults:
#          controller: ctrl_att
#          protocol: tls
#          callhome_port: auto        # -> 4335 (sub-opt 0x87)
#          ca_ra:
#            profile: att_common
#            port: 8080               # CA/RA server port (sub-opt 0x03)
#
#      Then delete the per-class `protocol: ssh` lines above, and give the
#      catch-all `protocol: ssh` to keep it on SSH. Switching the whole lab
#      back later is that one `protocol:` line.
#
#      A class needing its own CA port overrides just that -- `ca_ra: {port: N}`
#      keeps the inherited profile. `ca_ra.port` also takes {ipv4: N, ipv6: M}
#      when the CA answers on a different port per family.
#
#   3. Regenerate. Both dhcpd.conf and kea-dhcp4.conf then carry the full
#      chain 01 03 04 05 06 81 86 87; the generator aborts if the two
#      backends would disagree.
#
# A class left at `protocol: tls` with no ca_ra block is still valid -- it
# emits 0x81 + 0x86 (+ 0x87 if set) and suits an O-RU that already holds a
# certificate. Leaving out callhome_port on a tls class now warns: without
# 0x87 the O-RU uses its firmware default of 4334, the SSH port, and TLS
# call-home never completes.
# ---------------------------------------------------------------------------
